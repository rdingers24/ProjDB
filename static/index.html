<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Majors Team History</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header>
        <div class="brand">
          <span class="brand-mark">M</span>
          <div>
            <h1>Majors Team History</h1>
            <p>Pick a team to see win and runner-up years.</p>
          </div>
        </div>
      </header>

      <main>
        <section class="panel">
          <label for="teamSelect">Team</label>
          <select id="teamSelect" aria-label="Choose a team"></select>
        </section>

        <section class="panel info-grid">
          <div class="metric-card">
            <span class="metric-label">Wins</span>
            <strong id="winCount">—</strong>
          </div>
          <div class="metric-card">
            <span class="metric-label">Runner-Up</span>
            <strong id="runnerCount">—</strong>
          </div>
        </section>

        <section class="panel result-panel">
          <div class="result-box">
            <h2>Win years</h2>
            <p id="wins">Select a team to view the years they won.</p>
          </div>
          <div class="result-box">
            <h2>Runner-up years</h2>
            <p id="runnerUp">Select a team to view the years they finished second.</p>
          </div>
        </section>
      </main>
    </div>

    <script>
      const teamSelect = document.getElementById("teamSelect");
      const winsEl = document.getElementById("wins");
      const runnerUpEl = document.getElementById("runnerUp");
      const winCountEl = document.getElementById("winCount");
      const runnerCountEl = document.getElementById("runnerCount");

      async function getTeams() {
        const response = await fetch("/api/teams");
        const data = await response.json();
        return data.teams;
      }

      async function getTeam(team) {
        const response = await fetch(`/api/team/${encodeURIComponent(team)}`);
        if (!response.ok) return null;
        return await response.json();
      }

      function renderYears(element, years, emptyMessage) {
        if (!years || years.length === 0) {
          element.textContent = emptyMessage;
          return;
        }
        element.textContent = years.join(" · ");
      }

      async function renderTeam(team) {
        const teamData = await getTeam(team);
        if (!teamData) {
          winsEl.textContent = "No data found.";
          runnerUpEl.textContent = "No data found.";
          winCountEl.textContent = "—";
          runnerCountEl.textContent = "—";
          return;
        }
        winCountEl.textContent = teamData.count.wins;
        runnerCountEl.textContent = teamData.count.runner_up;
        renderYears(winsEl, teamData.wins, "No championship wins listed.");
        renderYears(runnerUpEl, teamData.runner_up, "No runner-up finishes listed.");
      }

      async function init() {
        const teams = await getTeams();
        if (!teams || teams.length === 0) return;

        teamSelect.innerHTML = teams
          .map((team) => `<option value="${team}">${team}</option>`)
          .join("");

        teamSelect.addEventListener("change", async (event) => {
          await renderTeam(event.target.value);
        });

        await renderTeam(teams[0]);
      }

      init();
    </script>
  </body>
</html>
